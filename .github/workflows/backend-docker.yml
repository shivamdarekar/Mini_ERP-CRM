name: ERP Backend Docker CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'
    tags:
      - 'v*'

  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: shivamdarekar/mini-erp-backend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Docker Buildx
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # Docker Hub login
      # ------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ------------------------------------------------------
      # Generate Docker image metadata
      # ------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # ------------------------------------------------------
      # Build and push image
      # ------------------------------------------------------
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Docker layer caching through Docker Hub
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max

      # ------------------------------------------------------
      # Show image digest
      # ------------------------------------------------------
      - name: Image digest
        run: |
          echo "Docker image pushed successfully."
          echo "Digest: ${{ steps.build.outputs.digest }}"

      # ------------------------------------------------------
      # Deployment information
      # ------------------------------------------------------
      - name: Deployment status
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Docker image pushed successfully."
          echo "Railway deployment should now use the updated image."